<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Repaso con Flashcards</h1>
        <p>Selecciona un bloque para comenzar:</p>
        
        <select id="selector-bloque">
            <option value="">-- Elige un bloque --</option>
            <option value="bloque1">Bloque 1: Fundamentos</option>
            <option value="bloque2">Bloque 2: Señalamiento vial</option>
            <option value="bloque3">Bloque 3: Mecánica y Controles Básicos</option>
            <option value="bloque4">Bloque 4: Conduccion y maniobras seguras en la carretera</option>
            <option value="bloque5">Bloque 5: Factores de riesgo y prevencion</option>
            <option value="bloque6">Bloque 6: Normas y consecuencias en la ley de transito</option>
        </select>
    </header>

    <main>
        <div id="contenedor-flashcard">
            <div class="flashcard" id="flashcard">
                <div class="cara cara-frontal">
                    <p id="texto-frontal">Selecciona un bloque arriba para empezar a estudiar.</p>
                </div>
                <div class="cara cara-trasera">
                    <p id="texto-trasero">Concepto</p>
                </div>
            </div>
        </div>

        <button id="btn-siguiente" style="display: none;">Siguiente Tarjeta</button>

        <div id="contenedor-notificacion"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
